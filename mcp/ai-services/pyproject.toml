[project]
name = "ai-services"
version = "0.1.0"
description = "FastAPI and MCP service that fronts OCR, TTS and ASR backends behind one endpoint."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "mcp>=1.12,<2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI's Depends/File defaults and the optional-MCP import guard are intentional.
extend-ignore = ["B008", "BLE001"]
